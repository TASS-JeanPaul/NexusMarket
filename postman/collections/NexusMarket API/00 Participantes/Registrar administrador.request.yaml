$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Administradora de prueba",
      "identityDocument": "ADM{{$timestamp}}",
      "email": "admin{{$timestamp}}@nexusmarket.co",
      "phone": "3001112233",
      "role": "ADMINISTRATOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Creado', () => pm.response.to.have.status(201));
      const d = pm.response.json();
      pm.collectionVariables.set('adminId', d.id);
      pm.test('Queda activo', () => pm.expect(d.status).to.eql('ACTIVE'));
    language: text/javascript
order: 1000
