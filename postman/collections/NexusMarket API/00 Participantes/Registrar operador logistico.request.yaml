$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Operador logistico de prueba",
      "identityDocument": "OPE{{$timestamp}}",
      "email": "operador{{$timestamp}}@nexusmarket.co",
      "phone": "3003334455",
      "role": "LOGISTICS_OPERATOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Creado', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('operatorId', pm.response.json().id);
    language: text/javascript
order: 3000
