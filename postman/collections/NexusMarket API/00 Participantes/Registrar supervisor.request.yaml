$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Supervisor de prueba",
      "identityDocument": "SUP{{$timestamp}}",
      "email": "supervisor{{$timestamp}}@nexusmarket.co",
      "phone": "3002223344",
      "role": "SUPERVISOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Creado', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('supervisorId', pm.response.json().id);
    language: text/javascript
order: 2000
