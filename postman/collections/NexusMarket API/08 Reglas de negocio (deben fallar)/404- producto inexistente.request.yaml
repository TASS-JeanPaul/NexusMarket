$kind: http-request
name: "404: producto inexistente"
url: "{{baseUrl}}/products/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404', () => pm.response.to.have.status(404));
      pm.test('Error tipado', () => pm.expect(pm.response.json().error).to.eql('RESOURCE_NOT_FOUND'));
    language: text/javascript
order: 1000
