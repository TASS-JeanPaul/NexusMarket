$kind: http-request
url: "{{baseUrl}}/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Categoria de prueba {{$timestamp}}",
      "description": "Creada por la coleccion de Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Creada', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('categoryId', pm.response.json().id);
    language: text/javascript
order: 1000
