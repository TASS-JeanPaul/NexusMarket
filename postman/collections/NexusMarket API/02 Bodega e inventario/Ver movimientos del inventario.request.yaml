$kind: http-request
url: "{{baseUrl}}/inventory/{{inventoryId}}/movements"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Correcto', () => pm.response.to.have.status(200));
      pm.test('Cada cambio quedo registrado', () => pm.expect(pm.response.json().length).to.be.at.least(2));
    language: text/javascript
order: 4000
