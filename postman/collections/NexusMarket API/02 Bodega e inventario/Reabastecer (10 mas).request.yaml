$kind: http-request
url: "{{baseUrl}}/inventory/restocks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": {{physicalProductId}},
      "variantId": {{variantId}},
      "warehouseId": {{warehouseId}},
      "quantity": 10,
      "userId": {{operatorId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Correcto', () => pm.response.to.have.status(200));
      pm.test('Quedan 60', () => pm.expect(pm.response.json().availableQuantity).to.eql(60));
    language: text/javascript
order: 3000
