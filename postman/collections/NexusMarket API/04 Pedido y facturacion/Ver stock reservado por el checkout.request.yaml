$kind: http-request
url: "{{baseUrl}}/inventory?productId={{physicalProductId}}"
method: GET
queryParams:
  productId: "{{physicalProductId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Correcto', () => pm.response.to.have.status(200));
      const i = pm.response.json()[0];
      pm.test('2 reservadas', () => pm.expect(i.reservedQuantity).to.eql(2));
      pm.test('58 disponibles', () => pm.expect(i.availableQuantity).to.eql(58));
    language: text/javascript
order: 2000
