services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexusmarket
      POSTGRES_USER: nexusmarket
      POSTGRES_PASSWORD: nexusmarket
    ports:
      - "5433:5432"
    volumes:
      - nexusmarket-data:/var/lib/postgresql/data
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusmarket -d nexusmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusmarket-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nexusmarket
      DB_USERNAME: nexusmarket
      DB_PASSWORD: nexusmarket
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  nexusmarket-data:
